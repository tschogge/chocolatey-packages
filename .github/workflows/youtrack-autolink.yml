name: YouTrack Autolink

on:
  pull_request:
    types: [opened, edited]

permissions:
  pull-requests: write

jobs:
  autolink:
    runs-on: ubuntu-latest
    steps:
      - uses: tschogge/youtrack-autolink-action@v1
        with:
          youtrack-url: https://kaktuswerk.youtrack.cloud
          youtrack-project: CP